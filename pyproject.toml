[project]
name = "pace-mjlab"
version = "0.1.0"
description = "PACE joint and actuator identification on mjlab (MuJoCo Warp)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "litt", email = "kittnablude@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["mjlab==1.6.0", "cmaes==0.13.1", "matplotlib>=3.9", "tensorboard>=2.17"]

[project.scripts]
collect-data = "pace_mjlab.scripts.data_collection:main"
fit = "pace_mjlab.scripts.fit:main"
show-ident = "pace_mjlab.scripts.show:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
cu130 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"
ignore = ["./typings"]
stubPath = "typings"

[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011", "B905"]

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings"]

[tool.uv]
conflicts = [[{ extra = "cu130" }, { extra = "cpu" }]]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[dependency-groups]
dev = ["pybind11-stubgen>=2.5.5", "pyright>=1.1.411", "pytest>=9.1.1", "ruff>=0.15.20", "ty>=0.0.56"]
